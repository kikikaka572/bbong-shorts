name: 뽕쇼츠 쇼츠 데이터 자동 수집

on:
  schedule:
    # 3시간마다 실행 (KST 기준 0, 3, 6, 9, 12, 15, 18, 21시)
    - cron: "0 */3 * * *"
  workflow_dispatch: # 수동 실행 버튼

permissions:
  contents: read # Supabase에 직접 쓰므로 repo write 불필요

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install requests

      - name: 쇼츠 수집 → Supabase upsert
        env:
          YOUTUBE_API_KEY:          ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_URL:             ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/fetch_shorts.py
